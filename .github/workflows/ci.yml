name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck version
        run: shellcheck --version

      - name: Lint
        run: shellcheck --shell=bash src/include.sh tests/integration.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bash (macOS)
        if: runner.os == 'macOS'
        run: brew list bash >/dev/null 2>&1 || brew install bash

      - name: Pin interpreter
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash_bin="$(brew --prefix)/bin/bash"
          else
            bash_bin=/bin/bash
          fi
          "$bash_bin" --version | head -1
          echo "BASH_BIN=$bash_bin" >> "$GITHUB_ENV"
          echo "PLUGIN_BASH=$bash_bin" >> "$GITHUB_ENV"

      - name: Integration tests
        run: |
          "$BASH_BIN" tests/integration.sh

  # Ensure the Bash 5 floor fails gracefully
  guard:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stock Bash skips gracefully
        run: |
          /bin/bash --version | head -1

          set +e
          output=$(HERDR_PLUGIN_EVENT_JSON='{}' /bin/bash src/include.sh 2>&1)
          status=$?
          set -e

          printf 'exit=%s\n' "$status"
          printf '%s\n' "$output"

          if [ "$status" -ne 0 ]; then
            echo "::error::expected exit 0, got $status"
            exit 1
          fi

          case "$output" in
            *"Bash 5 or newer is required"*) ;;
            *)
              echo "::error::expected the interpreter guard warning"
              exit 1
              ;;
          esac
